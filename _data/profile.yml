# Honeycomb rows, each centered so a 2-3-2 layout interlocks.
# tone: strong (navy) | signal (sand) | omitted (light). featured: larger label.
# icon: name of an _includes/icons/<icon>.svg shown above the label.
skills:
  - - { id: frontend, tone: strong }
    - { id: backend, tone: strong }
  - - { id: design }
    - { id: ai, tone: signal, featured: true, icon: sparkles }
    - { id: ops }
  - - { id: product, tone: strong }
    - { id: team }

# Most recent first. `current` highlights the entry and lists the missions under it.
# `years`: [start, end], or [start] for an ongoing job (i18n `jobs.<id>.end` then gives its end, e.g. "Now").
